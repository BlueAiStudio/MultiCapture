name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Code signing (Azure Artifact Signing). Until these are set in the repository settings,
      # the signing step is skipped and the exe stays unsigned. See docs/CODE_SIGNING.md.
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Import check
        run: python -c "import multicapture, i18n, extras; print(multicapture.APP_NAME, multicapture.VERSION)"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Windows self-test (screen grab, OCR)
        run: python tests/selftest_windows.py

      - name: App self-test (every extra feature switched on)
        run: python tests/selftest_app.py

      - name: Check themes
        run: python tools/check_themes.py

      - name: Build exe
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Sign exe (only when code signing is set up)
        if: env.AZURE_CLIENT_ID != '' && github.event_name != 'pull_request'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Show signature
        shell: pwsh
        run: Get-AuthenticodeSignature dist\MultiCapture.exe | Format-List Status, StatusMessage, SignerCertificate

      - name: Smoke test (exe starts and stays up for 10 s)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\MultiCapture.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Smoke test with all extra features switched on
        shell: pwsh
        run: |
          $d = Join-Path $env:APPDATA "MultiCapture"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          '{"guide_shown": true, "ask_on_close": false, "mode": "Scrolling", "feat_pin": true, "feat_ocr": true, "feat_scroll": true, "feat_record": true}' |
            Set-Content -Encoding utf8 (Join-Path $d "settings.json")
          $p = Start-Process -FilePath dist\MultiCapture.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MultiCapture-exe
          path: dist/MultiCapture.exe

      - name: Build Microsoft Store package (MSIX)
        run: powershell -ExecutionPolicy Bypass -File build_msix.ps1

      - name: Test-install the MSIX and start it
        # The Store signs the real package. Here a throw-away certificate is made only to
        # install a copy on the build machine and check that the packaged app starts.
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $msix = Get-ChildItem dist\*.msix | Select-Object -First 1
          $id = Get-Content -Raw packaging\msix\store.json | ConvertFrom-Json
          $cert = New-SelfSignedCertificate -Type Custom -Subject $id.Publisher -KeyUsage DigitalSignature `
            -FriendlyName "MultiCapture CI test" -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "ci-test" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:TEMP\ci.pfx" -Password $pw | Out-Null
          Import-PfxCertificate -FilePath "$env:TEMP\ci.pfx" -Password $pw -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $test = "$env:TEMP\MultiCapture-test.msix"
          Copy-Item $msix.FullName $test
          $kits = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signtool = Get-ChildItem $kits -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\' } |
                      Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /f "$env:TEMP\ci.pfx" /p ci-test $test
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Add-AppxPackage -Path $test
          $pkg = Get-AppxPackage -Name $id.IdentityName
          if (-not $pkg) { throw "package did not install" }
          Write-Host "Installed $($pkg.PackageFullName)"
          # The Store version must keep its data in the package's own LocalState folder:
          # put settings there, start the app, close it normally and check it saved them back there.
          $data = Join-Path $env:LOCALAPPDATA "Packages\$($pkg.PackageFamilyName)\LocalState\MultiCapture"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          '{"guide_shown": true, "ask_on_close": false}' | Set-Content -Encoding ascii (Join-Path $data "settings.json")
          Start-Process "explorer.exe" "shell:AppsFolder\$($pkg.PackageFamilyName)!MultiCapture"
          Start-Sleep -Seconds 12
          $p = Get-Process MultiCapture -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "*\WindowsApps\*" }
          if (-not $p) { throw "packaged app did not start (or exited early)" }
          Write-Host "Packaged app is running: $($p.Path -join ', ')"
          $p | ForEach-Object { [void]$_.CloseMainWindow() }
          Start-Sleep -Seconds 5
          $p | Where-Object { -not $_.HasExited } | Stop-Process -Force
          $saved = Get-Content -Raw (Join-Path $data "settings.json")
          Write-Host "settings.json after closing: $saved"
          if ($saved -notmatch '"view"') { throw "the packaged app did not save its settings in $data" }
          Remove-AppxPackage $pkg.PackageFullName

      - uses: actions/upload-artifact@v4
        with:
          name: MultiCapture-msix-for-Store
          path: dist/*.msix

      - name: Store screenshots (1920 x 1080, en / zh / fr)
        shell: powershell
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "Could not change the screen size: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "Screen: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"
          python tools/store_screenshots.py
          if ($LASTEXITCODE -ne 0) { throw "store_screenshots.py failed" }

      - name: TEMPORARY - save the Store screenshots on this PR branch for review
        if: github.event_name == 'pull_request' && github.head_ref == 'claude/project-thread-ch4w9x'
        shell: pwsh
        run: |
          $dst = "docs/store/screenshots"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          foreach ($l in "en", "zh", "fr") { Copy-Item -Recurse -Force "dist/store-screenshots/$l" $dst }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin $env:GITHUB_HEAD_REF
          git checkout -B $env:GITHUB_HEAD_REF origin/$env:GITHUB_HEAD_REF
          git add $dst
          git commit -m "Store screenshots made by CI [skip ci]"
          git push origin HEAD:$env:GITHUB_HEAD_REF

      - uses: actions/upload-artifact@v4
        with:
          name: Store-screenshots
          path: |
            dist/store-screenshots/en
            dist/store-screenshots/zh
            dist/store-screenshots/fr

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MultiCapture.exe
          generate_release_notes: true
