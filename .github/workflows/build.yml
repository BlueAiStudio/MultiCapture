name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Import check
        run: python -c "import multicapture, i18n; print(multicapture.APP_NAME, multicapture.VERSION)"

      - name: Build exe
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Smoke test (exe starts and stays up for 10 s)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\MultiCapture.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MultiCapture-exe
          path: dist/MultiCapture.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MultiCapture.exe
          generate_release_notes: true
