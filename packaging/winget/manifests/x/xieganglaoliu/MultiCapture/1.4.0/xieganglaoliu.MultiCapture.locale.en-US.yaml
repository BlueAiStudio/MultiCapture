ShortDescription: Multi-screenshot board for Windows - every capture is kept, laid out in a grid, annotated and copied.
Description: |-
  The built-in Snipping Tool keeps one capture at a time. MultiCapture keeps all of them in a history panel,
  so you can compare, arrange, annotate and paste several screenshots at once without saving files.
  Global hotkey Ctrl+Alt+S, editable annotations, measurements, PDF export, themes, and optional OCR,
  pin-on-top, scrolling capture and GIF recording.
